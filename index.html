<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jan Kočí × CyberCore Career Kit</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-theme="dark">
<div class="toolbar">
  <strong>CyberCore Career Kit</strong>
  <button id="editBtn">Edit content</button>
  <button id="themeBtn">Invert theme</button>
  <button id="resetBtn">Reset</button>
  <span class="spacer"></span>

  <label>Import JSON<input id="importInput" type="file" accept="application/json"></label>

<aside class="editor" id="editor"><h2>Editable variables</h2><div id="editorFields"></div><p class="note">Changes are stored only in this browser. Export JSON to transfer them. Print creates a selectable, clickable PDF.</p></aside>
